# Wächter über den Datenstand — läuft in GitHubs Cloud, NICHT auf dem Mac.
#
# Warum es das gibt: der Scraper fängt sich seit dem 21.07.2026 selbst (drei
# Anläufe je Lauf, Job tickt alle 15 Minuten und holt einen Fehlschlag von
# allein nach). Das deckt vorübergehende Aussetzer ab. Was es NICHT deckt, ist
# ein dauerhafter Defekt — Chromium nach einem Update kaputt, Cloudflare
# sperrt systematisch, Netz zu Hause weg. Dagegen hilft kein Wiederholen,
# sondern nur, dass jemand davon erfährt.
#
# Deshalb prüft dieser Job stündlich von außen, wie alt `live.ts` in data.json
# ist, und legt bei Überschreitung ein Issue an — GitHub schickt die Mail. Er
# schweigt außerhalb des Rennens und nachts (ein zugeklappter Mac ist kein
# Defekt), und er schließt das Issue wieder, sobald Daten nachkommen.
#
# Zweiter Job (export-pruefen, 29.07.2026): deckt einen ANDEREN Fehlermodus.
# `pruefen` oben sieht nur, ob der Scraper überhaupt noch lebt (`live.ts`
# gegen JETZT) — das bleibt blind für einen hängenden GPX-Export, bei dem der
# Scraper einwandfrei läuft und `live.ts` frisch bleibt, während der separate
# GPX-Unterabruf (track.json) stundenlang dieselben alten Punkte liefert.
# Genau das passierte am 27./28.07.2026 über 500+ Minuten, unbemerkt bis zum
# manuellen `check.mjs`-Lauf. `export-pruefen` rechnet denselben Abstand wie
# check.mjs' „Pause oder Funkloch"-Prüfung (`stilleMin − fixAltMin`, TOL in
# tools/check.mjs), bewusst dupliziert statt importiert — ein Actions-Job hat
# keinen Node-Kontext für einen Import, und close-genug-Kopie mit Verweis auf
# die Quelle ist hier ehrlicher als eine Bausatz-Abhängigkeit zwischen einem
# Cloud-Job und einem lokalen Skript. Ändert sich TOL.exportRueckstandMin in
# check.mjs, hier mitziehen.
#
# Dritter Job (deploy-pruefen, 02.08.2026): deckt einen DRITTEN Fehlermodus,
# den die ersten beiden nicht sehen können, weil beide `data.json`/`track.json`
# direkt aus dem Checkout lesen, nicht über die deployte Seite. Läuft 1 zu 1,
# was der Scraper committet, aber der GitHub-Pages-Build selbst scheitert, sind
# die Daten frisch im Git — nur die AUSGELIEFERTE Seite zeigt sie nicht. Genau
# das passierte am 02.08.2026 (Run #710): "job was not acquired by Runner ...
# even after multiple attempts" — eine GitHub-seitige Runner-Knappheit, keine
# Folge irgendeines Commits hier. Ein einzelner Fehlschlag heilt sich fast
# immer von selbst: der nächste Scraper-Push (alle ~25 min) löst automatisch
# einen neuen Build aus, und #710 tat genau das (nächster Push baute in 1m17s
# erfolgreich). Deshalb prüft dieser Job NICHT den letzten Build-Versuch für
# sich (der wäre bei jedem neuen, auch wieder scheiternden Push frisch und
# das Alter bliebe künstlich niedrig — genau der Fehler, den es hier zu
# vermeiden gilt), sondern sucht in der Build-HISTORIE den letzten
# tatsächlich ERFOLGREICHEN Build und alarmiert erst, wenn der zu lange
# zurückliegt.
name: Wächter

on:
  schedule:
    - cron: '25 * * * *'   # stündlich zur 25. Minute (UTC)
  workflow_dispatch:        # von Hand auslösbar, zum Ausprobieren

permissions:
  contents: read
  issues: write

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');

            // Ab hier gilt der Datenstand als hängend. Ein gesundes System
            // schreibt mindestens stündlich (Job tickt alle 15 min, arbeitet
            // ab 50 min Alter) — 3 Stunden lassen also mehreren
            // Fehlschlägen hintereinander Platz, bevor jemand geweckt wird.
            const SCHWELLE_MIN = 180;
            // Nachtruhe in lokaler Zeit: nachts ist der Mac oft legitim aus,
            // eine Meldung um 3 Uhr hilft niemandem. Was um 23 Uhr auffällt,
            // meldet der Lauf um 7 Uhr.
            const RUHE_AB = 23, RUHE_BIS = 7;
            const TITEL = 'Tracker-Abruf hängt';

            const data = JSON.parse(fs.readFileSync('data.json', 'utf8'));
            const st = data.settings || {};

            /* data.json trägt lokale Zeit OHNE Zeitzonen-Suffix (siehe
               CLAUDE.md). Hier läuft alles in UTC, ein nacktes `new Date(ts)`
               wäre also um zwei Stunden daneben. Das Rennen liegt komplett in
               der Sommerzeit, deshalb ist +02:00 durchgehend richtig. */
            const alsLokal = s => new Date(s + '+02:00');

            const jetzt = new Date();
            const start = alsLokal(st.start);
            const ende = new Date(alsLokal(st.deadline).getTime() + 24 * 3600 * 1000);

            // Offenes Wächter-Issue suchen (Pull Requests kommen hier mit raus).
            const liste = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', per_page: 100,
            });
            const offen = liste.data.find(i => !i.pull_request && i.title === TITEL);

            if (jetzt < start || jetzt > ende) {
              core.info('Außerhalb des Rennfensters — nichts zu tun.');
              return;
            }

            const lv = data.live && data.live.ts ? alsLokal(data.live.ts) : null;
            const altMin = lv && isFinite(lv) ? Math.round((jetzt - lv) / 60000) : null;
            core.info(`Live-Stand ist ${altMin === null ? 'unbekannt' : altMin + ' min'} alt.`);

            // Alles in Ordnung: ein offenes Issue wieder schließen.
            if (altMin !== null && altMin < SCHWELLE_MIN) {
              if (offen) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: offen.number,
                  body: `Es läuft wieder — der Live-Stand ist ${altMin} min alt (${data.live.km} km). Automatisch geschlossen.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: offen.number, state: 'closed',
                });
                core.info('Wieder in Ordnung, Issue geschlossen.');
              }
              return;
            }

            const stunde = Number(jetzt.toLocaleString('en-GB', {
              timeZone: 'Europe/Berlin', hour: '2-digit', hour12: false,
            }));
            if (stunde >= RUHE_AB || stunde < RUHE_BIS) {
              core.info(`Nachtruhe (${stunde} Uhr lokal) — Meldung wartet bis ${RUHE_BIS} Uhr.`);
              return;
            }

            if (offen) {
              core.info(`Issue #${offen.number} ist schon offen — keine zweite Meldung.`);
              return;
            }

            const alt = altMin === null ? 'unbekannt (live fehlt in data.json)' : `${Math.floor(altMin/60)} h ${altMin%60} min`;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: TITEL,
              body: [
                `Der letzte erfolgreiche Abruf ist **${alt}** her (Schwelle: ${SCHWELLE_MIN} min).`,
                data.live ? `Letzter Stand: ${data.live.km} km, Platz ${data.live.rank}, \`live.ts\` = ${data.live.ts}.` : '',
                '',
                'Der Scraper wiederholt sich selbst (drei Anläufe je Lauf, Tick alle 15 Minuten).',
                'Dass es trotzdem so lange still ist, spricht für etwas Dauerhaftes:',
                '',
                '- Mac aus, im Ruhezustand oder ohne Netz — dann ist alles in Ordnung, es holt nach dem Aufwachen von selbst auf.',
                '- `launchctl list | grep tcr84` — läuft der Job noch?',
                '- `tail -40 tools/update-tracker.log` — woran scheitert er?',
                '- Cloudflare sperrt systematisch, oder die Tracker-Seite hat sich geändert (`window.ridersArray`).',
                '',
                'Sofort aufholen: `cd tools && node update-tracker.mjs --commit --push`',
                '',
                '_Dieses Issue schließt sich von selbst, sobald wieder Daten ankommen._',
              ].filter(Boolean).join('\n'),
            });
            core.info('Issue angelegt.');

  export-pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');

            // Deckungsgleich mit TOL.exportRueckstandMin in tools/check.mjs:
            // der Export arbeitet nachweislich in Stapeln und holt Rückstände
            // bis 149 min von allein auf (siehe dort) — erst darüber ist es
            // kein normaler Betrieb mehr.
            const SCHWELLE_MIN = 180;
            const RUHE_AB = 23, RUHE_BIS = 7;
            const TITEL = 'GPX-Export hängt';

            const data = JSON.parse(fs.readFileSync('data.json', 'utf8'));
            const st = data.settings || {};
            let track = null;
            try { track = JSON.parse(fs.readFileSync('track.json', 'utf8')); } catch { /* noch keine Spur, z.B. vor Rennbeginn */ }

            const alsLokal = s => new Date(s + '+02:00');

            const jetzt = new Date();
            const start = alsLokal(st.start);
            const ende = new Date(alsLokal(st.deadline).getTime() + 24 * 3600 * 1000);

            const liste = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', per_page: 100,
            });
            const offen = liste.data.find(i => !i.pull_request && i.title === TITEL);

            if (jetzt < start || jetzt > ende) {
              core.info('Außerhalb des Rennfensters — nichts zu tun.');
              return;
            }

            const pts = track && Array.isArray(track.points) ? track.points : null;
            const lv = data.live || null;

            /* Derselbe Abstand wie in check.mjs: nicht das Alter der Spur für
               sich (schweigt der Tracker, altern Live-Fix UND Spur im
               Gleichschritt, und daran ist der Export unschuldig), sondern
               wie weit der Live-Fix der Spur inzwischen VORAUS ist. */
            let rueckstandMin = null;
            if (pts && pts.length > 1 && lv && lv.ts && lv.fixMinsAgo != null) {
              const letzterPkt = pts[pts.length - 1];
              const stilleMin = (jetzt.getTime()/1000 - letzterPkt[3]) / 60;
              const fixAltMin = lv.fixMinsAgo + (jetzt - alsLokal(lv.ts)) / 60000;
              rueckstandMin = stilleMin - fixAltMin;
            }
            core.info(`Export-Rückstand ist ${rueckstandMin === null ? 'unbekannt' : Math.round(rueckstandMin) + ' min'}.`);

            if (rueckstandMin === null || rueckstandMin < SCHWELLE_MIN) {
              if (offen) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: offen.number,
                  body: rueckstandMin === null
                    ? 'Kein Rückstand mehr messbar (Spur oder Live-Stand fehlt gerade). Automatisch geschlossen.'
                    : `Export ist wieder dran — Rückstand nur noch ${Math.round(rueckstandMin)} min. Automatisch geschlossen.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: offen.number, state: 'closed',
                });
                core.info('Wieder in Ordnung, Issue geschlossen.');
              }
              return;
            }

            const stunde = Number(jetzt.toLocaleString('en-GB', {
              timeZone: 'Europe/Berlin', hour: '2-digit', hour12: false,
            }));
            if (stunde >= RUHE_AB || stunde < RUHE_BIS) {
              core.info(`Nachtruhe (${stunde} Uhr lokal) — Meldung wartet bis ${RUHE_BIS} Uhr.`);
              return;
            }

            if (offen) {
              core.info(`Issue #${offen.number} ist schon offen — keine zweite Meldung.`);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: TITEL,
              body: [
                `Der GPX-Export hinkt dem Live-Fix seit **${Math.round(rueckstandMin)} min** hinterher (Schwelle: ${SCHWELLE_MIN} min) — weiter, als er es je von allein aufgeholt hat.`,
                lv ? `Live-Stand: ${lv.km} km, Platz ${lv.rank}, \`live.ts\` = ${lv.ts} — der Scraper selbst läuft also, nur die Spur hängt.` : '',
                '',
                'Der Export arbeitet normalerweise in Stapeln (Rückstände bis 149 min beobachtet, dann am Stück nachgeliefert).',
                'Dass er diese Schwelle reißt, ist neu — mögliche Ursachen:',
                '',
                '- der Tracker-Anbieter hat einen dauerhaften Defekt am Export (nicht am Live-Feed, der bleibt ja frisch)',
                '- `tail -60 tools/update-tracker.log | grep -i "spur\\|export"` — was meldet check.mjs zuletzt?',
                '- manueller Nachstoß: `cd tools && node update-tracker.mjs --commit --push` (holt nichts nach, was der Anbieter nicht hat, zeigt aber den aktuellen Stand)',
                '',
                'Betrifft nur die aus der Spur abgeleiteten Werte (Höhenprofil, Tagesbalken, CP-Nähe-Erkennung) — Kilometerstand, Tempo und Platz in der Kopfzeile bleiben davon unberührt, die kommen aus dem separaten Live-Feed.',
                '',
                '_Dieses Issue schließt sich von selbst, sobald der Export wieder aufgeholt hat._',
              ].filter(Boolean).join('\n'),
            });
            core.info('Issue angelegt.');

  deploy-pruefen:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pages: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');

            // Deckungsgleich mit den anderen beiden Jobs, aus demselben Grund:
            // mehrere Fehlschläge hintereinander dürfen sein, bevor jemand
            // geweckt wird — ein einzelner heilt sich fast immer über den
            // nächsten Scraper-Push von selbst.
            const SCHWELLE_MIN = 180;
            const RUHE_AB = 23, RUHE_BIS = 7;
            const TITEL = 'Pages-Build hängt';

            const data = JSON.parse(fs.readFileSync('data.json', 'utf8'));
            const st = data.settings || {};
            const alsLokal = s => new Date(s + '+02:00');

            const jetzt = new Date();
            const start = alsLokal(st.start);
            const ende = new Date(alsLokal(st.deadline).getTime() + 24 * 3600 * 1000);

            const liste = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', per_page: 100,
            });
            const offen = liste.data.find(i => !i.pull_request && i.title === TITEL);

            if (jetzt < start || jetzt > ende) {
              core.info('Außerhalb des Rennfensters — nichts zu tun.');
              return;
            }

            /* Bewusst NICHT /pages/builds/latest (nur der letzte Versuch,
               egal ob erfolgreich): bei einem dauerhaften Defekt, der JEDEN
               Build scheitern lässt, würde dessen Zeitstempel mit jedem
               neuen Scraper-Push (~alle 25 min) neu gesetzt — das Alter
               bliebe künstlich niedrig und die Schwelle griffe nie. Gesucht
               wird stattdessen in der Build-LISTE (neueste zuerst) der
               letzte Eintrag mit status:'built', und dessen Alter zählt.
               30 Einträge decken bei diesem Push-Takt weit mehr als die
               180-Minuten-Schwelle ab. Schlägt der Abruf selbst fehl (API-
               Aussetzer beim Abfragen, nicht am Build), wird das NICHT als
               Alarm gewertet — anders als bei `pruefen`s live.ts, das aus
               unserem eigenen Commit-Inhalt kommt, wäre ein Alarm hier ein
               Fehlschluss über eine fremde Diagnose-Abfrage, nicht über den
               Build selbst. */
            let letzterErfolg = null;
            try {
              const res = await github.request('GET /repos/{owner}/{repo}/pages/builds', {
                owner: context.repo.owner, repo: context.repo.repo, per_page: 30,
              });
              letzterErfolg = res.data.find(b => b.status === 'built') || null;
            } catch (e) {
              core.info(`Pages-Build-Historie nicht abrufbar, kein Alarm daraus: ${e.message}`);
              return;
            }

            const altMin = letzterErfolg ? Math.round((jetzt - new Date(letzterErfolg.updated_at)) / 60000) : null;
            core.info(`Letzter erfolgreicher Pages-Build: ${altMin === null ? 'keiner in den letzten 30 Versuchen' : altMin + ' min her'}.`);

            if (altMin !== null && altMin < SCHWELLE_MIN) {
              if (offen) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: offen.number,
                  body: `Der Pages-Build läuft wieder — letzter erfolgreicher Build ${altMin} min her. Automatisch geschlossen.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: offen.number, state: 'closed',
                });
                core.info('Wieder in Ordnung, Issue geschlossen.');
              }
              return;
            }

            const stunde = Number(jetzt.toLocaleString('en-GB', {
              timeZone: 'Europe/Berlin', hour: '2-digit', hour12: false,
            }));
            if (stunde >= RUHE_AB || stunde < RUHE_BIS) {
              core.info(`Nachtruhe (${stunde} Uhr lokal) — Meldung wartet bis ${RUHE_BIS} Uhr.`);
              return;
            }

            if (offen) {
              core.info(`Issue #${offen.number} ist schon offen — keine zweite Meldung.`);
              return;
            }

            const alt = altMin === null ? 'nicht in den letzten 30 Build-Versuchen' : `${Math.floor(altMin/60)} h ${altMin%60} min`;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: TITEL,
              body: [
                `Der letzte erfolgreiche GitHub-Pages-Build liegt **${alt}** zurück (Schwelle: ${SCHWELLE_MIN} min).`,
                'data.json/track.json/profile.json sind im Git vermutlich frisch (das prüfen die anderen beiden Wächter-Jobs separat)',
                '— nur die AUSGELIEFERTE Seite zeigt sie nicht. Ein einzelner Build-Fehlschlag heilt sich normalerweise mit dem',
                'nächsten Scraper-Push von selbst (alle ~25 min); dass das hier so lange nicht passiert ist, spricht für etwas Dauerhaftes:',
                '',
                '- https://github.com/digitalerdude/tcr84/actions/workflows/pages-build-deployment — Verlauf der Build-Läufe',
                '- https://www.githubstatus.com/ — GitHub-weite Störung bei Pages/Actions?',
                '- Sofort aufholen: einen leeren Commit pushen (`git commit --allow-empty -m "Build neu anstoßen" && git push`) oder in den Repo-Settings → Pages neu bauen lassen.',
                '',
                '_Dieses Issue schließt sich von selbst, sobald wieder ein Build `built` meldet._',
              ].filter(Boolean).join('\n'),
            });
            core.info('Issue angelegt.');
